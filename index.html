<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bunny vs Cake - 兔子躲蛋糕</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
</head>
<body>

<div id="app">

  <!-- ========== 启动画面 ========== -->
  <div id="scene-splash" class="scene splash-scene active" style="opacity:1">
    <div class="splash-age">16+</div>
    <div class="splash-bg">
      <div id="splash-title-group" class="splash-fade">
        <h1 class="splash-title">Bunny vs Cake</h1>
        <p class="splash-sub">白菜对我笑组产品</p>
      </div>
      <div id="splash-health-group" class="splash-fade" style="opacity:0">
        <h2 class="splash-health-title">健康游戏忠告</h2>
        <ul class="splash-health-list">
          <li>抵制不良游戏，拒绝盗版游戏。</li>
          <li>注意自我保护，谨防受骗上当。</li>
          <li>适度游戏益脑，沉迷游戏伤身。</li>
          <li>合理安排时间，享受健康生活。</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- ========== 场景1：开始菜单 ========== -->
  <div id="scene-start" class="scene">
    <div class="start-bg">
      <div class="start-glow start-glow--top-right"></div>
      <div class="start-glow start-glow--bottom-left"></div>
      <div class="start-header">
        <div class="start-icon">🐰🎂</div>
        <h1 class="start-title-en">Bunny vs Cake</h1>
        <p class="start-title-cn">兔子躲蛋糕</p>
      </div>
      <div class="start-buttons" id="start-buttons">
        <button class="start-btn" data-action="arcade">
          <span class="start-btn-label">街机模式</span>
          <span class="start-btn-desc">休闲轻松·宽容度高</span>
        </button>
        <button class="start-btn" data-action="realistic">
          <span class="start-btn-label">拟真模式</span>
          <span class="start-btn-desc">精准挑战·切边碎片</span>
        </button>
        <button class="start-btn" data-action="skin">
          <span class="start-btn-label">皮肤选择</span>
          <span class="start-btn-desc">兔子皮肤</span>
        </button>
        <button class="start-btn" data-action="settings">
          <span class="start-btn-label">设置</span>
          <span class="start-btn-desc">音量·音效·音乐</span>
        </button>
      </div>
      <p class="start-version">v1.0.0</p>
    </div>
  </div>

  <!-- ========== 场景2：游戏画布 ========== -->
  <div id="scene-game" class="scene">
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <!-- ========== 场景3：结算页面 ========== -->
  <div id="scene-result" class="scene">
    <div class="result-bg">
      <div class="result-glow result-glow--center"></div>
      <div class="result-card">
        <p class="result-mode" id="result-mode"></p>
        <p class="result-label">最终分数</p>
        <p class="result-score" id="result-score"></p>
        <div class="result-divider"></div>
        <p class="result-high-label">最高纪录</p>
        <p class="result-high" id="result-high"></p>
        <div class="result-buttons" id="result-buttons">
          <button class="result-btn result-btn--primary" data-action="retry">再来一次</button>
          <button class="result-btn" data-action="home">返回主页</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
